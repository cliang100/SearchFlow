name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: searchflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: searchflow_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U searchflow" --health-interval 2s --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      TEST_DATABASE_URL: postgresql://searchflow:test@localhost:5432/searchflow_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt pip-audit
      - run: python -m pytest
      - run: pip-audit -r requirements.txt
      - name: Check JavaScript syntax
        run: node --check static/js/main.js
      - run: docker build -t searchflow .
